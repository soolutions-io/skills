name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # ogni mattina: il repo è allineato alla CLI in produzione?
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coerenza del marketplace
        run: python3 scripts/lint.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scansione segreti (gitleaks, tutta la storia)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  in-sync:
    # Le skill portal-cli/portal-partner seguono la CLI in produzione: se il portale
    # ha pubblicato una versione nuova, questo job diventa rosso finché non si sincronizza.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allineato al portale?
        run: python3 scripts/sync_from_portal.py --check
